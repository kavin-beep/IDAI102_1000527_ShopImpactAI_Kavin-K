<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="ShopImpact — a conscious shopping journal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a170f"/><stop offset=".55" stop-color="#120f0a"/><stop offset="1" stop-color="#0e0c09"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0" stop-color="#a3c585" stop-opacity=".32"/><stop offset=".4" stop-color="#e8b04a" stop-opacity=".12"/><stop offset="1" stop-color="#e8b04a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="type"><rect x="72" y="214" height="42" width="0">
      <animate attributeName="width" values="0;560;560;0" keyTimes="0;.35;.85;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <!-- a garment on a hanger -->
    <g id="hanger">
      <path d="M0 0 v10 m0 0 c-3 0 -5 -5 -1 -7" stroke="#bdb3a3" stroke-width="2" fill="none"/>
      <path d="M0 10 L-34 30 H34 Z" stroke="#bdb3a3" stroke-width="2" fill="none"/>
    </g>
    <path id="shirt" d="M-34 30 L-46 48 L-36 56 L-28 46 L-28 118 H28 V46 L36 56 L46 48 L34 30 Q18 40 0 40 Q-18 40 -34 30 Z"/>
    <path id="leaf" d="M0 0 C 8 -10, 22 -10, 28 0 C 22 10, 8 10, 0 0 Z M0 0 L28 0"/>
  </defs>
  <style>
    .swing{transform-box:fill-box;transform-origin:50% 0%;animation:swing 4.2s ease-in-out infinite}
    @keyframes swing{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    .fall{animation:fall 10s linear infinite}
    @keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate(-90px,380px) rotate(320deg);opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .sweep{animation:sweep 7s linear infinite}
    @keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1400px)}}
    .tick{animation:tick 18s linear infinite}
    @keyframes tick{to{transform:translateX(-600px)}}
  </style>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect class="sweep" x="0" y="0" width="220" height="380" fill="#f4edE1" opacity=".035" transform="skewX(-20)"/>

  <!-- clothes rail -->
  <line x1="690" y1="92" x2="1170" y2="92" stroke="#6f675a" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(740 92)"><g class="swing" style="animation-delay:-.4s"><use href="#hanger"/><use href="#shirt" fill="#a3c585" opacity=".92"/></g></g>
  <g transform="translate(830 92)"><g class="swing" style="animation-delay:-1.6s"><use href="#hanger"/><use href="#shirt" fill="#e8b04a" opacity=".92"/></g></g>
  <g transform="translate(920 92)"><g class="swing" style="animation-delay:-2.7s"><use href="#hanger"/><use href="#shirt" fill="#e07a5f" opacity=".92"/></g></g>
  <g transform="translate(1010 92)"><g class="swing" style="animation-delay:-.9s"><use href="#hanger"/><use href="#shirt" fill="#81b29a" opacity=".92"/></g></g>
  <g transform="translate(1100 92)"><g class="swing" style="animation-delay:-3.3s"><use href="#hanger"/><use href="#shirt" fill="#d4a373" opacity=".92"/></g></g>
  <!-- price tags: reused vs new -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="1">
    <g transform="translate(752 236)"><rect width="74" height="22" rx="11" fill="#17140f" stroke="#a3c585"/><text x="37" y="15" text-anchor="middle" fill="#cfe6b8">♻ REUSED</text></g>
    <g transform="translate(932 236)"><rect width="74" height="22" rx="11" fill="#17140f" stroke="#e07a5f"/><text x="37" y="15" text-anchor="middle" fill="#f6c1b1">0.62 KG</text></g>
    <g transform="translate(1022 236)"><rect width="74" height="22" rx="11" fill="#17140f" stroke="#e8b04a"/><text x="37" y="15" text-anchor="middle" fill="#f4d28a">⏸ 7 DAYS</text></g>
  </g>

  <!-- falling leaves -->
  <g fill="#a3c585" stroke="#17140f" stroke-width=".8">
    <use href="#leaf" class="fall" x="700" y="0" style="animation-delay:0s"/>
    <use href="#leaf" class="fall" x="860" y="0" style="animation-delay:-3s" fill="#e8b04a"/>
    <use href="#leaf" class="fall" x="1010" y="0" style="animation-delay:-6s"/>
    <use href="#leaf" class="fall" x="1150" y="0" style="animation-delay:-8s" fill="#e07a5f"/>
    <use href="#leaf" class="fall" x="600" y="0" style="animation-delay:-4.5s" fill="#81b29a"/>
  </g>
  <rect y="300" width="1200" height="80" fill="#0e0c09" opacity=".7"/>

  <!-- copy -->
  <g font-family="Consolas, 'JetBrains Mono', ui-monospace, monospace" font-size="13" letter-spacing="3" fill="#a59c8a">
    <circle cx="78" cy="78" r="4.5" fill="#a3c585" class="pulse"/>
    <text x="92" y="83">SHOPIMPACT · CONSCIOUS SHOPPING JOURNAL · PYTHON + STREAMLIT</text>
  </g>
  <g font-family="Fraunces, 'Instrument Serif', Georgia, 'Times New Roman', serif">
    <text x="68" y="168" font-size="92" fill="#f4ede1" letter-spacing="-2">Shop<tspan fill="#e8b04a" font-style="italic">Impact</tspan></text>
  </g>
  <g clip-path="url(#type)">
    <text x="72" y="244" font-family="Fraunces, Georgia, serif" font-size="30" font-style="italic" fill="#e6ddca">Small choices. A clearer picture.</text>
  </g>
  <rect class="caret" x="72" y="220" width="2" height="30" fill="#e8b04a">
    <animate attributeName="x" values="72;632;632;72" keyTimes="0;.35;.85;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#6f675a">
    <text x="72" y="300">USEEIO v1.4 · EPA EQUIVALENTS · ARGON2ID · NEON POSTGRESQL · 94 TESTS</text>
  </g>
  <!-- ticker -->
  <g>
    <g class="tick" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="18" fill="#bdb3a3">
      <text x="72" y="350">Buy less, choose well  ✳  Second-hand first  ✳  Repair before replace  ✳  Pause before you buy  ✳  Buy less, choose well  ✳  Second-hand first  ✳  Repair before replace  ✳  Pause before you buy</text>
    </g>
  </g>
</svg>
